{% extends "base.html" %}

{% block title %}Create Thread | CSHub{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forum.css') }}">
{% endblock %}

{% block content %}
<section class="forum-page">
  <div class="forum-layout">
    <main class="forum-main">

      <a href="{{ url_for('main.forum') }}" class="thread-action">
        ← Back to forum
      </a>

      <div class="thread-card">
        <div class="thread-content">
          <h1>Create a new thread</h1>

          <form id="create-thread-form" method="POST" action="{{ url_for('main.create_thread') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="thread-title">Title</label>
            <input id="thread-title" name="title" type="text" required>

            <label for="thread-category">Category</label>
            <select id="thread-category" name="category">
              <option value="General">General</option>
              <option value="AI & Data Science">AI &amp; Data Science</option>
              <option value="Software Engineering">Software Engineering</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Courses & Study Help">Courses &amp; Study Help</option>
            </select>

            <label for="thread-tags">Tags</label>
            <input
              id="thread-tags"
              name="tags"
              type="text"
              placeholder="Example: flask, mvc, web-development"
            >

            <label for="thread-body">Body</label>
            <textarea id="thread-body" name="body" rows="8" required></textarea>

            <button id="submit-thread-button" type="submit" class="forum-create-button">
              Create thread
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>
</section>
{% endblock %}
